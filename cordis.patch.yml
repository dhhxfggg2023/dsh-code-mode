# 编程模式 (Code Mode): a DSH agent preset for creating and maintaining large projects.
# Same level as the built-in standard/ptc/minimal/cordis presets. The child plugin list is
# copied verbatim from the built-in standard preset, because child rows cannot reference
# another preset's id — a new preset must carry the whole catalog. Two differences:
#   1. persona speaks as the maintainer of a large, long-lived codebase;
#   2. the code-memory group adds the project ledger tools and the briefing prompt section.
#
# Edits saved from the Web editor override this row's `config.plugins` by id from the profile patch.
- insert:
    - id: preset-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code
        name: 编程模式
        description: 为大型项目的创造与维护而设：项目账本、开局简报、反重复门禁。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # No `suffix:` here. 0.2.1 interpolates `{{…}}` strictly and registers
              # only `provider` / `model`, so the old
              # `suffix: Your working directory is {{cwd}}.` failed every turn in
              # this mode with "unknown prompt variable". The working directory
              # reaches the model as a runtime-context section
              # (CONTEXT_ORDERS.WORKING_DIRECTORY), which is where the built-in
              # standard preset leaves it too.
              prefix: You are a coding agent powered by the {{model}} model, working on a large, long-lived codebase.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # Compaction is a feature of the harness, and this preset has no opinion about *when*
              # it happens. What it does have an opinion about is *what a checkpoint says*: see the
              # `auto` key below — that path writes the ledger's own handover, not a model's summary.
              - id: compaction-basic
                name: 'dsh-code-mode/lib/compact-summary.js'
                config:
                  # The engine reads this row's `auto`. What it does with it:
                  # `if (this.config.auto) this._registerAutomaticCompaction();` registers **both**
                  # automatic paths — the between-step pressure compaction and the context-overflow
                  # recovery. With it off, a request that finally exceeds the window fails with the
                  # provider's context-window error instead of being recovered.
                  #
                  # The checkpoint itself calls **no model**: this row mounts
                  # `lib/compact-summary.js`, whose `summarize()` returns the ledger-derived handover
                  # (see `lib/ledger.js`'s `handover()`). Handing a whole conversation to a model to
                  # be compressed in one shot is not done on this row;
                  # `DSH_CODE_MODEL_COMPACTION=allow` is the break-glass, and is the only path in
                  # this preset that reaches the engine's own summarizer.
                  auto: true
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: code-memory
            name: cordis:group
            group: true
            config:
              - id: code-prompt
                name: 'dsh-code-mode/lib/prompt.js'
              - id: code-brief
                name: 'dsh-code-mode/lib/tool-brief.js'
              - id: code-record
                name: 'dsh-code-mode/lib/tool-record.js'
              - id: code-verify
                name: 'dsh-code-mode/lib/tool-verify.js'
              - id: code-gate
                name: 'dsh-code-mode/lib/gate-verify.js'
              - id: code-budget
                name: 'dsh-code-mode/lib/budget.js'
              # The third leg of the ledger: mistakes are written by code_record
              # and read by code_brief, but nothing consulted them at the moment
              # of the decision. This one does, and books a debt when a failing
              # turn records nothing.
              - id: code-pit-guard
                name: 'dsh-code-mode/lib/pit-guard.js'
              # The board, re-stated into the conversation every few steps. It reads
              # `tasks.json` and nothing else — not the conversation, not the journal — so it
              # cannot invent a narrative; the worst it can do is be stale, and it says so.
              # `reciteEverySteps: 0` switches it off.
              - id: code-recite
                name: 'dsh-code-mode/lib/recite.js'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            # Enabled so this mode can use the official authoring path: a new or
            # overridden preset is a bundle patch installed into the profile with
            # plugin_manager. It was `disabled: true` here (and in the built-in
            # presets) because its actions need approval; the session approval
            # policy must therefore be "ask", not "never", or the call is refused
            # and looks like a hang. The profile patch also enables it by id, so
            # this row only matters for installs that do not carry that patch.
            disabled: false
          # New in the 0.2.1 standard preset; carried here so this preset stays a
          # strict superset. Off by default, exactly as standard ships it.
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
